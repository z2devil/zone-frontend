name: Frontend CI and Deploy

on:
  push:
    branches: ['master']
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.20.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  deploy:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: zone-frontend-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_IMAGE_NAME }}:${{ github.sha }}

      - name: Ship image and deploy
        # 镜像为私有且服务器直连 Docker Hub 超时：由 CI 拉取后经 SSH 直接传给服务器加载
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          IMAGE: ${{ secrets.DOCKER_IMAGE_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh && ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          docker pull "$IMAGE:$GITHUB_SHA"
          docker save "$IMAGE:$GITHUB_SHA" | gzip -1 \
            | sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" 'gunzip | sudo docker load'
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            sudo docker tag '$IMAGE:$GITHUB_SHA' '$IMAGE:latest'
            cd /home/ubuntu
            sudo docker-compose up -d --no-deps zone-frontend
            echo 'Cleaning up old Docker images...'
            sudo docker image prune -f"
